[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[project]
name = "forgetful-factory"
version = "0.1.0"
description = "Initialize a workspace factory for local repositories and GitHub work sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["agent-shell-py==0.5.0"]

[dependency-groups]
dev = ["ruff==0.17.0", "import-linter==2.15"]

[project.scripts]
forgetful-factory = "forgetful_factory.cli.main:main"

[tool.uv]
required-version = ">=0.13.5"

[tool.uv.build-backend]
source-include = ["tests/*.py", "tests/fixtures/*.md"]

[tool.importlinter]
root_package = "forgetful_factory"

[[tool.importlinter.contracts]]
id = "domain-independent"
name = "Domain stays independent"
type = "forbidden"
source_modules = ["forgetful_factory.domain"]
forbidden_modules = [
    "forgetful_factory.application",
    "forgetful_factory.adapters",
    "forgetful_factory.cli",
    "forgetful_factory.configuration",
]

[[tool.importlinter.contracts]]
id = "application-contracts"
name = "Application uses contracts, not adapters"
type = "forbidden"
source_modules = ["forgetful_factory.application"]
forbidden_modules = [
    "forgetful_factory.adapters",
    "forgetful_factory.cli",
    "forgetful_factory.configuration",
]

[[tool.importlinter.contracts]]
id = "adapters-no-cli"
name = "Adapters cannot depend on the CLI"
type = "forbidden"
source_modules = ["forgetful_factory.adapters"]
forbidden_modules = ["forgetful_factory.cli"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]
