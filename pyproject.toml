[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[project]
name = "forgetful-factory"
version = "0.1.0"
description = "Initialize a workspace factory for local repositories and GitHub work sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["agent-shell-py==0.5.0"]

[project.optional-dependencies]
# Audited in docs/plans/discord-py-audit.md; only the Discord relay child imports it.
discord = ["discord.py==2.7.1"]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "import-linter==2.15",
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    # Tests check the relay's fake against the real library.
    "discord.py==2.7.1",
]

[project.scripts]
forgetful-factory = "forgetful_factory.cli.main:main"

[tool.uv]
required-version = ">=0.13.5"

[tool.uv.build-backend]
source-include = [
    "tests/*.py",
    "tests/contracts/*.py",
    "tests/fixtures/*.json",
    "tests/fixtures/*.md",
    "tests/fixtures/*.ts",
    "tests/fixtures/saved_data/*.json",
]

[tool.importlinter]
root_package = "forgetful_factory"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "top-level"
name = "Top level, downwards only: entry, composition, factory, contexts, shared"
type = "layers"
containers = ["forgetful_factory"]
# A new top-level package fails until it is classified here.
exhaustive = true
# ":" lets siblings import each other: the CLI uses the configuration facade, and contexts use
# each other's ports and models.
layers = [
    "__main__",
    "cli : configuration",
    "factory",
    "agents : channels : forge : planning : runtime : ticketing : workspace",
    "shared",
]

[[tool.importlinter.contracts]]
id = "inside-each-area"
name = "Inside a context, imports go down: adapters, services, ports, model"
type = "layers"
containers = [
    "forgetful_factory.agents",
    "forgetful_factory.channels",
    "forgetful_factory.factory",
    "forgetful_factory.forge",
    "forgetful_factory.planning",
    "forgetful_factory.runtime",
    "forgetful_factory.ticketing",
    "forgetful_factory.workspace",
]
exhaustive = true
layers = ["(adapters)", "(services)", "ports", "(model)"]

[[tool.importlinter.contracts]]
id = "adapters-from-composition"
name = "Only composition imports context adapters"
type = "forbidden"
source_modules = [
    "forgetful_factory.shared",
    "forgetful_factory.*.services",
    "forgetful_factory.*.ports",
    "forgetful_factory.*.model",
]
forbidden_modules = ["forgetful_factory.*.adapters"]

[[tool.importlinter.contracts]]
id = "entry-through-cli"
name = "The entry point imports no adapter directly"
type = "forbidden"
source_modules = ["forgetful_factory.__main__"]
forbidden_modules = ["forgetful_factory.*.adapters"]
# The entry point runs the CLI, which composes adapters; only a direct import fails.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "adapters-independent"
name = "Adapter packages do not import each other"
type = "independence"
modules = [
    "forgetful_factory.agents.adapters",
    "forgetful_factory.channels.adapters",
    "forgetful_factory.factory.adapters",
    "forgetful_factory.forge.adapters",
    "forgetful_factory.planning.adapters",
    "forgetful_factory.runtime.adapters",
    "forgetful_factory.ticketing.adapters",
    "forgetful_factory.workspace.adapters",
]

[[tool.importlinter.contracts]]
id = "core-no-processes"
name = "Core code, ports and models start no processes and open no sockets"
type = "forbidden"
source_modules = [
    "forgetful_factory.*.services",
    "forgetful_factory.*.ports",
    "forgetful_factory.*.model",
]
forbidden_modules = ["subprocess", "socket"]

[[tool.importlinter.contracts]]
id = "agentshell-in-agents"
name = "Only the agents adapter imports AgentShell"
type = "forbidden"
source_modules = [
    "forgetful_factory.__main__",
    "forgetful_factory.*.model",
    "forgetful_factory.*.ports",
    "forgetful_factory.*.services",
    "forgetful_factory.channels",
    "forgetful_factory.cli",
    "forgetful_factory.configuration",
    "forgetful_factory.factory",
    "forgetful_factory.forge",
    "forgetful_factory.planning",
    "forgetful_factory.runtime",
    "forgetful_factory.shared",
    "forgetful_factory.ticketing",
    "forgetful_factory.workspace",
]
forbidden_modules = ["agent_shell"]
# Composition reaches AgentShell through the agents adapter; a direct import still fails.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "discord-in-its-adapter"
name = "Only the Discord channel adapter imports discord.py"
type = "forbidden"
source_modules = [
    "forgetful_factory.__main__",
    "forgetful_factory.*.model",
    "forgetful_factory.*.ports",
    "forgetful_factory.*.services",
    "forgetful_factory.agents",
    "forgetful_factory.channels.adapters.terminal",
    "forgetful_factory.cli",
    "forgetful_factory.configuration",
    "forgetful_factory.factory",
    "forgetful_factory.forge",
    "forgetful_factory.planning",
    "forgetful_factory.runtime",
    "forgetful_factory.shared",
    "forgetful_factory.ticketing",
    "forgetful_factory.workspace",
]
forbidden_modules = ["discord"]
# Composition builds the link, which starts the relay as a child; a direct import still fails.
allow_indirect_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest".msg = "pytest is the test runner only; write unittest.TestCase tests."

[tool.pytest]
testpaths = ["tests"]
faulthandler_timeout = 120
# discord.py 2.7.1 imports audioop on Python 3.12; Python 3.13 uses audioop-lts instead.
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning:discord.player"]
