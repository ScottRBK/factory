name: ci

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ensure tmux is available
        run: |
          sudo apt-get update --error-on=any
          apt-cache policy tmux
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --only-binary=:all: uv==0.13.5
      - name: Install package and development dependencies
        run: uv sync --locked --python '${{ matrix.python-version }}'
      - name: Build and verify package
        run: |
          uv build
          uv run --locked python tests/check_package.py dist/*.whl
      - name: Lint Python
        run: uv run --locked ruff check src tests
      - name: Check architecture
        run: uv run --locked lint-imports --no-cache
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # Warn at 450 s (half the job limit), on pass or fail, so growth shows before a cancel.
        run: |
          uv run --locked python -m compileall -q -f --invalidation-mode checked-hash src
          start=$SECONDS
          status=0
          uv run --locked pytest -n auto --dist worksteal -v --durations=25 || status=$?
          elapsed=$((SECONDS - start))
          echo "Tests took ${elapsed}s."
          if [ "$elapsed" -gt 450 ]; then
            echo "::warning title=Slow test suite::Tests took ${elapsed}s, over the 450s budget" \
              "(half the 15-minute job limit). See docs/plans/ci-test-runtime.md."
          fi
          exit "$status"
