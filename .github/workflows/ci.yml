name: ci

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install --only-binary=:all: uv==0.13.1
      - name: Install package and development dependencies
        run: uv sync --locked --python '${{ matrix.python-version }}'
      - name: Build package
        run: uv build
      - name: Lint Python
        run: uv run --locked ruff check src tests
      - name: Check architecture
        run: uv run --locked lint-imports --no-cache
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --locked python -m unittest discover -s tests -v
