name: Nix check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    # The full suite is part of `nix flake check` and takes ~10 minutes on a warm
    # store; allow the same budget as the publisher so a cold closure build does
    # not turn a slow check into a false failure.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # No Cachix substituter is configured here. The cache workflow lands
      # separately, and until it publishes this repo's outputs the checks have to
      # build from source, which is also the honest behaviour for a first build.
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b1 # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run flake checks
        run: nix flake check
